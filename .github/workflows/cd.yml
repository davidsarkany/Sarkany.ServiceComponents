name: Continuous Delivery

# Pushing a version tag runs every check of the CI, then packs and publishes the Sarkany.ServiceComponents.* packages
# to nuget.org and creates a GitHub release with the packages attached. The tag must be the compatibility version of
# versions.props (UpstreamVersion, e.g. 0.2.3-beta.1) or UpstreamVersion.N for later fixes (e.g. 0.2.3-beta.1.1);
# a leading 'v' is allowed.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  # Same checks as the CI; nothing is published unless all of them pass.
  checks:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.x'

    # First: a wrong tag fails in seconds, before the long checks.
    - name: Tag matches the compatibility version
      run: bash ./build/version.sh release "$GITHUB_REF_NAME"

    - name: Test with coverage
      run: bash ./build/coverage.sh

    - name: Public API and interop against the original release
      run: bash ./build/upstream-check.sh

    - name: Drop-in check against the packed packages
      run: bash ./build/dropin.sh

  publish:
    needs: checks
    runs-on: ubuntu-latest
    # The environment can require a manual approval before publishing (Settings > Environments > production).
    environment: production
    permissions:
      contents: write   # GitHub release
      id-token: write   # NuGet trusted publishing
    steps:

    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.x'

    - name: Version from the tag
      run: |
        version="$(bash ./build/version.sh release "$GITHUB_REF_NAME")"
        echo "version=$version" >> "$GITHUB_ENV"
        echo "Version: $version"

    - name: Pack
      run: >
        dotnet pack ./src/ServiceComponents.sln --configuration Release -p:Version="$version"
        -p:ContinuousIntegrationBuild=true --output nuget-packages

    - name: List packages
      run: ls nuget-packages

    - name: Upload packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nuget-packages
        path: nuget-packages

    # Trusted publishing: no stored API key. Needs a trusted publishing policy on nuget.org for this repository and
    # workflow, and the repository variable NUGET_USER (the nuget.org user name).
    - name: NuGet login
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish to nuget.org
      run: >
        dotnet nuget push "nuget-packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
        --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        prerelease=""
        [[ "$version" == *-* ]] && prerelease="--prerelease"
        # Release notes: the topmost version section of the changelog (the release being published).
        awk '/^## /{ if (seen) exit; seen = 1; next } seen' CHANGELOG.md > release-notes.md
        [ -s release-notes.md ] || cp CHANGELOG.md release-notes.md
        gh release create "$GITHUB_REF_NAME" nuget-packages/* --title "$version" --notes-file release-notes.md $prerelease
