name: Continuous Integration

on:
  push:
    branches:
      - main
    tags-ignore:
      - '*'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  # Build (the PublicAPI analyzers fail it on any public API change that is not declared), unit, integration
  # (Testcontainers RabbitMQ) and sample tests; fails below the coverage thresholds.
  test:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.x'

    - name: Build
      run: dotnet build ./src/ServiceComponents.sln --configuration Release

    - name: Test with coverage
      run: bash ./build/coverage.sh

    - name: Coverage summary
      if: always()
      run: cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-report
        path: artifacts/coverage/report

  # Against the original release of versions.props (UpstreamVersion): its whole public API must exist here (ApiCompat),
  # and the samples built from it and from this repository must work together over RabbitMQ and HTTP, in all four
  # pairings.
  upstream:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.x'

    - name: Public API and interop against the original release
      run: bash ./build/upstream-check.sh

    - name: Upload interop logs
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: interop-logs
        path: artifacts/interop

  # The samples must build and pass their tests against the packed Sarkany.ServiceComponents.* packages, changing
  # nothing but the package ids.
  dropin:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.0.x'

    - name: Drop-in check against the packed packages
      run: bash ./build/dropin.sh
