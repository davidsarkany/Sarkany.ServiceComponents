name: Continuous Integration

on:
  push:
    branches:
      - main
    tags-ignore:
      - '*'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  # Build (the PublicAPI analyzers fail it on any public API change that is not declared), unit, integration
  # (Testcontainers RabbitMQ) and sample tests; fails below the coverage thresholds.
  test:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build
      run: dotnet build ./src/ServiceComponents.sln --configuration Release

    - name: Test with coverage
      run: bash ./build/coverage.sh

    - name: Coverage summary
      if: always()
      run: cat artifacts/coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: artifacts/coverage/report

  # The samples built from the original ServiceComponents 0.2.0-beta.12 packages and from this repository must work
  # together over RabbitMQ and HTTP, in all four pairings.
  interop:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Interop between the original packages and this repository
      run: bash ./build/interop.sh

    - name: Upload interop logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: interop-logs
        path: artifacts/interop

  # The samples must build and pass their tests against the packed Sarkany.ServiceComponents.* packages, changing
  # nothing but the package ids.
  dropin:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Drop-in check against the packed packages
      run: bash ./build/dropin.sh
